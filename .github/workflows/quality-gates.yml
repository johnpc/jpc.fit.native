name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  # Persistent build cache on the self-hosted Mac mini, outside the workspace
  # (checkout wipes it every job): DerivedData stays warm across runs, and each
  # run snapshots its products to products/<run_id> for the test jobs.
  CI_CACHE: ci-cache/jpc.fit.native
  SCHEME: jpc.fit.native
  DESTINATION: "platform=iOS Simulator,name=iPhone 17 Pro"

jobs:
  lint:
    name: Source Line Limit + Gherkin Sync
    # Self-hosted Mac Mini. This workflow also runs on pull_request, and
    # self-hosted runners on a public repo are unsafe for fork PRs (arbitrary
    # code execution) -- so only run for push-to-main or a PR authored by the
    # repo owner. Other PRs simply skip this job.
    if: github.event_name != 'pull_request' || contains(fromJSON('["johnpc","github-actions[bot]"]'), github.event.pull_request.user.login)
    runs-on: [self-hosted, mac-mini-light]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Source file line limit (≤100)
        run: bash scripts/check_line_limit.sh
      - name: Acceptance tests in sync with .feature files
        run: python3 scripts/generate_acceptance_tests.py --check
      - name: Dead code
        run: python3 scripts/dead_code_check.py
      - name: Duplicated code
        run: python3 scripts/duplication_check.py
      - name: Banned Any/AnyObject types
        run: python3 scripts/banned_types_check.py
      - name: Halstead difficulty ≤ 20
        run: python3 scripts/halstead_check.py
      - name: State-machine catalog
        run: python3 scripts/check_state_machines.py

  build:
    name: Build
    # Self-hosted Mac Mini. This workflow also runs on pull_request, and
    # self-hosted runners on a public repo are unsafe for fork PRs (arbitrary
    # code execution) -- so only run for push-to-main or a PR authored by the
    # repo owner. Other PRs simply skip this job.
    if: github.event_name != 'pull_request' || contains(fromJSON('["johnpc","github-actions[bot]"]'), github.event.pull_request.user.login)
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$HOME/$CI_CACHE/DerivedData" \
            -enableCodeCoverage YES \
            -quiet
      - name: Snapshot this run's products for the test jobs
        run: |
          CACHE="$HOME/$CI_CACHE"
          OUT="$CACHE/products/${{ github.run_id }}"
          rm -rf "$OUT" && mkdir -p "$CACHE/products"
          cp -Rc "$CACHE/DerivedData/Build/Products" "$OUT"   # APFS clone: instant
          ls "$OUT"/*.xctestrun
          ls -1dt "$CACHE"/products/* | tail -n +11 | xargs rm -rf
      # No cache save/restore: DerivedData already persists on disk between
      # jobs on this self-hosted runner (same machine, same workspace) --
      # round-tripping it through GitHub's cache service was costing a
      # multi-GB upload/download at home-connection speed for nothing
      # (observed costing 35+ minutes of a job that should take ~1).

  unit-tests:
    name: Unit Tests + Coverage
    # Self-hosted Mac Mini. This workflow also runs on pull_request, and
    # self-hosted runners on a public repo are unsafe for fork PRs (arbitrary
    # code execution) -- so only run for push-to-main or a PR authored by the
    # repo owner. Other PRs simply skip this job.
    if: github.event_name != 'pull_request' || contains(fromJSON('["johnpc","github-actions[bot]"]'), github.event.pull_request.user.login)
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Run unit tests
        run: |
          XCTESTRUN=$(ls "$HOME/$CI_CACHE/products/${{ github.run_id }}"/*.xctestrun | head -1)
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" \
            -only-testing:"jpc.fit.nativeTests" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -quiet
      - name: Check coverage ≥ 80%
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          python3 scripts/coverage_check.py coverage.json
      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult

  crap-analysis:
    name: CRAP Score ≤ 30
    # Self-hosted Mac Mini. This workflow also runs on pull_request, and
    # self-hosted runners on a public repo are unsafe for fork PRs (arbitrary
    # code execution) -- so only run for push-to-main or a PR authored by the
    # repo owner. Other PRs simply skip this job.
    if: github.event_name != 'pull_request' || contains(fromJSON('["johnpc","github-actions[bot]"]'), github.event.pull_request.user.login)
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 30
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
      - name: Calculate CRAP scores
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          python3 scripts/crap_check.py coverage.json

  acceptance-tests:
    name: Acceptance Tests (Gherkin)
    # Self-hosted Mac Mini. This workflow also runs on pull_request, and
    # self-hosted runners on a public repo are unsafe for fork PRs (arbitrary
    # code execution) -- so only run for push-to-main or a PR authored by the
    # repo owner. Other PRs simply skip this job.
    if: github.event_name != 'pull_request' || contains(fromJSON('["johnpc","github-actions[bot]"]'), github.event.pull_request.user.login)
    runs-on: [self-hosted, mac-mini]
    needs: build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Verify generated acceptance tests match .feature files
        run: python3 scripts/generate_acceptance_tests.py --check
      # The scenarios drive the app in DEMO mode: the in-process fake backend
      # (DemoAPIService) — no credentials, no network, deterministic seed.
      # One run, no retry loop: a test that needs a retry is a bug we fix
      # (README "There is no such thing as a flaky test").
      - name: Run acceptance tests
        run: |
          XCTESTRUN=$(ls "$HOME/$CI_CACHE/products/${{ github.run_id }}"/*.xctestrun | head -1)
          RESULT_PATH=/tmp/AcceptanceResults.xcresult
          rm -rf "$RESULT_PATH"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" \
            -only-testing:"jpc.fit.nativeUITests/AcceptanceTests" \
            -resultBundlePath "$RESULT_PATH" \
            -quiet
      - name: Upload acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results
          path: /tmp/AcceptanceResults.xcresult

  deploy:
    # Shared deploy (johnpc/ci-workflows): archive with the CI keychain's manual
    # signing (app, widget and watch targets), upload, and on a version conflict
    # bump the minor version and open a ci/bump-version-* PR that auto-merges.
    # secrets: inherit passes DEPLOY_PAT, so that PR is authored by johnpc and
    # its required checks run on their own (a GITHUB_TOKEN PR starts no CI).
    needs: [unit-tests, crap-analysis, acceptance-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: johnpc/ci-workflows/.github/workflows/ios-deploy-native.yml@v1
    secrets: inherit
    with:
      project: jpc.fit.native.xcodeproj
      scheme: jpc.fit.native
      bump: minor
